services:
  - type: web
    name: datapilot-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: MODEL_BUNDLE_PATH
        value: artifacts/model_bundle.joblib
      - key: MLFLOW_TRACKING_URI
        value: sqlite:///mlflow.db
